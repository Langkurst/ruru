name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      apple:
        description: Also build the macOS and iPhone apps (macOS runner minutes cost more)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A push cancels the previous push build, but never a hand-started (macOS and iPhone) build.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests (protocol, EQ, session, app controller)
        run: ./gradlew :core:protocol:jvmTest :core:dsp:jvmTest :core:session:jvmTest :app:shared:desktopTest --console=plain

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:desktop:packageMsi :app:desktop:packageExe --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            app/desktop/build/compose/binaries/main/msi/*.msi
            app/desktop/build/compose/binaries/main/exe/*.exe

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: ./gradlew :app:desktop:packageDeb :app:desktop:packageRpm --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            app/desktop/build/compose/binaries/main/deb/*.deb
            app/desktop/build/compose/binaries/main/rpm/*.rpm

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Release signing key (from repository secrets, when set)
        env:
          KEYSTORE_BASE64: ${{ secrets.RURU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RURU_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=ruru\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - run: ./gradlew :app:android:assembleRelease --console=plain
      - run: |
          version=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          mkdir -p out
          cp app/android/build/outputs/apk/release/*.apk "out/ruru-$version.apk"
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out/*.apk }

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Bluetooth helper (universal binary)
        run: |
          mkdir -p app/desktop/resources/macos
          swiftc -O -target arm64-apple-macos12 platform/macos/helper/main.swift -o /tmp/ruru-bt-arm64
          swiftc -O -target x86_64-apple-macos12 platform/macos/helper/main.swift -o /tmp/ruru-bt-x64
          lipo -create /tmp/ruru-bt-arm64 /tmp/ruru-bt-x64 -output app/desktop/resources/macos/ruru-bt-mac
          chmod +x app/desktop/resources/macos/ruru-bt-mac
      - run: ./gradlew :app:desktop:packageDmg --console=plain
      - name: Packaging log
        if: failure()
        run: cat app/desktop/build/compose/logs/*/*.txt || true
      - name: Name the file after the real version
        run: |
          v=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          mkdir -p out && mv app/desktop/build/compose/binaries/main/dmg/*.dmg "out/Ruru-$v-macos.dmg"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: out/*.dmg }

  ios:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: brew install xcodegen
      - name: Unsigned IPA (sign it with your own sideloading tool)
        run: |
          cd iosApp
          xcodegen generate
          xcodebuild -project Ruru.xcodeproj -scheme Ruru -configuration Release -sdk iphoneos \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app=build/Build/Products/Release-iphoneos/Ruru.app
          find "$app" -name 'monasans_regular.ttf' | grep -q . || { echo "The fonts are missing from the app"; exit 1; }
          test -f "$app/Assets.car" || { echo "The app icon is missing"; exit 1; }
          version=$(grep '^ruru.version=' ../gradle.properties | cut -d= -f2)
          mkdir -p Payload out
          cp -R "$app" Payload/
          zip -qr "out/Ruru-$version.ipa" Payload
      - name: Open it on a virtual iPhone in demo mode
        run: |
          cd iosApp
          xcodebuild -project Ruru.xcodeproj -scheme Ruru -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build-sim/Build/Products/Debug-iphonesimulator/Ruru.app
          xcrun simctl launch "$udid" io.github.langkurst.ruru --demo
          sleep 20
          mkdir -p shots
          xcrun simctl io "$udid" screenshot shots/iphone-demo.png
          xcrun simctl spawn "$udid" launchctl list | grep -q 'io.github.langkurst.ruru' || { echo "Ruru stopped after launch (a crash)"; exit 1; }
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: iosApp/out/*.ipa }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ios-simulator-screenshot, path: iosApp/shots/*.png, if-no-files-found: ignore }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - run: rm -f dist/*.png
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
