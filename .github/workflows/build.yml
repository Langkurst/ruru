name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      apple:
        description: Also build the macOS and iPhone apps
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A push cancels the previous push build, but never a hand-started (macOS and iPhone) build.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A release tag must match the version in gradle.properties and the iPhone project
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but gradle.properties says ruru.version=$version. Tag v$version, or change the version first."
            exit 1
          fi
          ios_version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' iosApp/project.yml)
          if [ "$ios_version" != "$version" ]; then
            echo "::error::iosApp/project.yml says MARKETING_VERSION $ios_version but gradle.properties says ruru.version=$version. Change both."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests (protocol, EQ, session, app controller)
        run: ./gradlew :core:protocol:jvmTest :core:dsp:jvmTest :core:session:jvmTest :core:vendors:jvmTest :app:shared:desktopTest --console=plain

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:desktop:packageReleaseMsi :app:desktop:createReleaseDistributable --console=plain
      # The setup program (Inno Setup is on GitHub's Windows images; installed here only if it is missing).
      - name: Build the setup program
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = ((Select-String -Path gradle.properties -Pattern '^ruru.version=').Line -split '=')[1]
          & $iscc /Q "/DAppVersion=$version" packaging\windows\ruru.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem app/desktop/build/compose/binaries/main-release/setup
      - name: Size budget (the installers can shrink, not quietly grow)
        shell: bash
        run: bash .github/size-budget.sh 100000000 app/desktop/build/compose/binaries/main-release/msi/*.msi app/desktop/build/compose/binaries/main-release/setup/*.exe
      - name: Check the app starts (demo mode)
        shell: pwsh
        run: |
          $exe = "app/desktop/build/compose/binaries/main-release/app/Ruru/Ruru.exe"
          if (-not (Test-Path $exe)) { Write-Error "No app at $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--demo" -WindowStyle Minimized -PassThru -RedirectStandardOutput ruru-start.log -RedirectStandardError ruru-start-err.log
          Start-Sleep -Seconds 15
          $stopped = $p.HasExited
          $output = (Get-Content ruru-start.log, ruru-start-err.log -ErrorAction SilentlyContinue) -join "`n"
          Get-Process -Name Ruru -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($stopped) { Write-Host "Ruru stopped after launch"; Write-Host $output; exit 1 }
          # Staying alive isn't enough: the tray keeps the process up even if the window fails.
          if ($output -match "Exception in thread|Error was captured in composition") { Write-Host "Ruru failed at launch:"; Write-Host $output; exit 1 }
      - name: Check the setup installs, updates in place, starts and uninstalls
        shell: pwsh
        run: ./packaging/windows/check-setup.ps1 -Setup (Resolve-Path app/desktop/build/compose/binaries/main-release/setup/*.exe).Path
      - uses: actions/upload-artifact@v7
        id: unsigned
        with:
          name: windows
          path: |
            app/desktop/build/compose/binaries/main-release/msi/*.msi
            app/desktop/build/compose/binaries/main-release/setup/*.exe
      # Free code signing from SignPath Foundation (see site/code-signing.html). Inert until the project is
      # approved: it runs only on a release tag, and only when the SIGNPATH_API_TOKEN secret exists. The
      # organisation ID, project and policy come from the repository variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG (default ruru) and SIGNPATH_SIGNING_POLICY_SLUG (default release-signing).
      # What gets signed is in .signpath/artifact-configuration.xml.
      - name: Is code signing set up?
        id: signing
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version=$(grep '^ruru.version=' gradle.properties | cut -d= -f2 | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"
          else
            echo "No SIGNPATH_API_TOKEN secret: the installers stay unsigned."
          fi
      - name: Sign the installers with SignPath
        id: sign
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ruru' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.signing.outputs.version }}"
      - name: Replace the unsigned installers with the signed ones
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows
          overwrite: true
          path: |
            signed/msi/*.msi
            signed/setup/*.exe

  linux:
    needs: test
    # The .deb's dependencies come from the build machine; 24.04 keeps it installable there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - run: ./gradlew :app:desktop:packageReleaseDeb :app:desktop:packageReleaseRpm :app:desktop:createReleaseDistributable --console=plain
      - name: Size budget (the installers can shrink, not quietly grow)
        run: bash .github/size-budget.sh 107780000 app/desktop/build/compose/binaries/main-release/deb/*.deb app/desktop/build/compose/binaries/main-release/rpm/*.rpm
      - name: Library budget (at most 64 libraries ship; 58 on 11 November 2026)
        run: |
          n=$(find app/desktop/build/compose/binaries/main-release/app/Ruru/lib/app -maxdepth 1 -name '*.jar' | wc -l)
          echo "$n libraries in the app"
          [ "$n" -gt 0 ] || { echo "::error::No libraries found; the app folder has moved"; exit 1; }
          [ "$n" -le 64 ] || { echo "::error::$n libraries ship, over the budget of 64"; exit 1; }
      - name: Check the app starts (on a virtual screen, demo mode)
        run: |
          # The app folder uses the main package name (Ruru); only the .deb/.rpm are lower case.
          launcher=app/desktop/build/compose/binaries/main-release/app/Ruru/bin/Ruru
          test -x "$launcher" || { echo "No app at $launcher"; ls -R app/desktop/build/compose/binaries/main-release | head -40; exit 1; }
          Xvfb :99 -screen 0 1280x800x24 &
          xvfb=$!
          sleep 2
          DISPLAY=:99 "$launcher" --demo > ruru-start.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then echo "Ruru stopped after launch"; cat ruru-start.log; exit 1; fi
          # Staying alive isn't enough: the tray keeps the process up even if the window fails.
          if grep -q -e "Exception in thread" -e "Error was captured in composition" ruru-start.log; then echo "Ruru failed at launch:"; cat ruru-start.log; kill "$pid" "$xvfb" || true; exit 1; fi
          kill "$pid" "$xvfb" || true
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            app/desktop/build/compose/binaries/main-release/deb/*.deb
            app/desktop/build/compose/binaries/main-release/rpm/*.rpm

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Release signing key (from repository secrets, when set)
        env:
          KEYSTORE_BASE64: ${{ secrets.RURU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RURU_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=ruru\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - run: ./gradlew :app:android:assembleRelease --console=plain
      - name: Name the file (a release must be signed)
        run: |
          version=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          mkdir -p out
          if [ -f keystore.properties ]; then
            cp app/android/build/outputs/apk/release/*.apk "out/ruru-$version.apk"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::No signing key in the repository secrets, so the APK can't be installed. Not releasing it."
            exit 1
          else
            cp app/android/build/outputs/apk/release/*.apk "out/ruru-$version-unsigned.apk"
          fi
      - name: Size budget (the APK can shrink, not quietly grow)
        run: bash .github/size-budget.sh 2800000 out/*.apk # 0.2: 2.74 MB unsigned with the update card, desktop layout and their 11 languages
      - name: Let the emulator use hardware acceleration
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open it on an Android emulator in demo mode
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('keystore.properties') != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r out/ruru-*.apk
            adb shell pm grant io.github.langkurst.ruru android.permission.BLUETOOTH_CONNECT
            adb shell am start -W -n io.github.langkurst.ruru/io.github.langkurst.ruru.android.MainActivity --ez demo true
            sleep 15
            adb exec-out screencap -p > out/android-demo.png
            adb shell pidof io.github.langkurst.ruru
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out/*.apk }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: android-emulator-screenshot, path: out/*.png, if-no-files-found: ignore }

  macos:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.apple
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Bluetooth helper (universal binary)
        run: |
          mkdir -p app/desktop/resources/macos
          swiftc -O -target arm64-apple-macos12 platform/macos/helper/main.swift -o /tmp/ruru-bt-arm64
          swiftc -O -target x86_64-apple-macos12 platform/macos/helper/main.swift -o /tmp/ruru-bt-x64
          lipo -create /tmp/ruru-bt-arm64 /tmp/ruru-bt-x64 -output app/desktop/resources/macos/ruru-bt-mac
          chmod +x app/desktop/resources/macos/ruru-bt-mac
      - run: ./gradlew :app:desktop:packageReleaseDmg --console=plain
      - name: Packaging log
        if: failure()
        run: cat app/desktop/build/compose/logs/*/*.txt || true
      - name: Check the app is signed consistently, has its helper, and starts
        run: |
          app=app/desktop/build/compose/binaries/main-release/app/Ruru.app
          codesign --verify --deep --strict --verbose=2 "$app"
          helper=$(find "$app" -name ruru-bt-mac -type f | head -1)
          test -n "$helper" && file "$helper" || { echo "The Bluetooth helper is missing from the app"; exit 1; }
          "$app/Contents/MacOS/Ruru" --demo > ruru-start.log 2>&1 &
          pid=$!
          sleep 15
          kill -0 $pid || { echo "Ruru stopped after launch"; cat ruru-start.log; exit 1; }
          # Staying alive isn't enough: the tray keeps the process up even if the window fails.
          if grep -q -e "Exception in thread" -e "Error was captured in composition" ruru-start.log; then echo "Ruru failed at launch:"; cat ruru-start.log; kill $pid || true; exit 1; fi
          kill $pid
          wait $pid 2>/dev/null || true # let it close, or the next step's copy hands over to it and quits
      - name: Take a picture of the running app
        # The runner has a screen, so the real window can be looked at. What to look for (it checks the macOS
        # title bar from app/desktop Main.kt): the page runs under a transparent title bar with no system title
        # text, the three traffic lights sit at the top left with the owl and "Ruru" 78dp to their right (not on
        # top of them), the sidebar starts at the top, and nothing is cut off. Only the picture is kept; it is
        # never part of the release files (the release job collects installers by file extension).
        run: |
          app=app/desktop/build/compose/binaries/main-release/app/Ruru.app
          mkdir -p shots
          # Its own instance folder, so no earlier copy can take the launch over.
          RURU_INSTANCE_DIR="$RUNNER_TEMP/ruru-shot" "$app/Contents/MacOS/Ruru" --demo > shots/ruru-shot.log 2>&1 &
          pid=$!
          sleep 20
          osascript -e 'tell application "System Events" to set frontmost of (first process whose unix id is '"$pid"') to true' || true
          sleep 2
          osascript -e 'tell application "System Events" to get {name, title of every window} of (first process whose unix id is '"$pid"')' > shots/windows.txt 2>&1 || true
          screencapture -x shots/mac-window.png || true
          kill $pid || true
          wait $pid 2>/dev/null || true
          cat shots/windows.txt shots/ruru-shot.log || true
          ls -la shots
      - name: Name the file after the real version
        run: |
          v=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          mkdir -p out && mv app/desktop/build/compose/binaries/main-release/dmg/*.dmg "out/Ruru-$v-macos-arm64.dmg"
      - name: Size budget (the DMG can shrink, not quietly grow)
        run: bash .github/size-budget.sh 62900000 out/*.dmg
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: out/*.dmg }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: mac-screenshot, path: "shots/*", if-no-files-found: ignore }

  ios:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.apple
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: brew install xcodegen
      - name: Unsigned IPA (sign it with your own sideloading tool)
        run: |
          cd iosApp
          xcodegen generate
          xcodebuild -project Ruru.xcodeproj -scheme Ruru -configuration Release -sdk iphoneos \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app=build/Build/Products/Release-iphoneos/Ruru.app
          find "$app" -name 'monasans_regular.ttf' | grep -q . || { echo "The fonts are missing from the app"; exit 1; }
          test -f "$app/Assets.car" || { echo "The app icon is missing"; exit 1; }
          version=$(grep '^ruru.version=' ../gradle.properties | cut -d= -f2)
          mkdir -p Payload out
          cp -R "$app" Payload/
          zip -qr "out/Ruru-$version.ipa" Payload
      - name: Size budget (the IPA can shrink, not quietly grow)
        run: bash .github/size-budget.sh 13500000 iosApp/out/*.ipa
      - name: Open it on a virtual iPhone in demo mode
        run: |
          cd iosApp
          xcodebuild -project Ruru.xcodeproj -scheme Ruru -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in sorted(d.items(), reverse=True) if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build-sim/Build/Products/Debug-iphonesimulator/Ruru.app
          mkdir -p shots
          # Simulator apps run as ordinary Mac processes, so the pid simctl prints can be checked here.
          pid=$(xcrun simctl launch --stdout="$PWD/shots/stdout.txt" --stderr="$PWD/shots/stderr.txt" \
            "$udid" io.github.langkurst.ruru --demo | awk -F': ' '{print $2}')
          echo "Ruru pid: $pid"
          sleep 20
          xcrun simctl io "$udid" screenshot shots/iphone-demo.png
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Ruru stopped after launch. Its output:"
            cat shots/stderr.txt shots/stdout.txt || true
            find ~/Library/Logs/DiagnosticReports -name 'Ruru*' -newer shots/stdout.txt -exec head -c 6000 {} \; 2>/dev/null || true
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: iosApp/out/*.ipa }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ios-simulator-screenshot, path: "iosApp/shots/*", if-no-files-found: ignore }

  release:
    # A tag makes the draft release. A hand-started Apple run does everything except publish,
    # so the files a tag would release are checked before any tag exists.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.apple)
    needs: [windows, linux, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Collect the files and their checksums
        run: |
          # Installers only: the screenshot artifacts also hold pictures and the iPhone app's output.
          mkdir -p release
          for ext in msi exe deb rpm apk dmg ipa; do
            find dist -type f -name "*.$ext" -exec mv {} release/ \;
            if ! ls release/*."$ext" > /dev/null 2>&1; then
              echo "::error::No .$ext file to release"
              exit 1
            fi
          done
          cd release && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: release/*
