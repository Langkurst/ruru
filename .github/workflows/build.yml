name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      apple:
        description: Also build the macOS and iPhone apps (macOS runner minutes cost more)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests (protocol, EQ, session, app controller)
        run: ./gradlew :core:protocol:jvmTest :core:dsp:jvmTest :core:session:jvmTest :app:shared:desktopTest --console=plain

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:desktop:packageMsi :app:desktop:packageExe --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            app/desktop/build/compose/binaries/main/msi/*.msi
            app/desktop/build/compose/binaries/main/exe/*.exe

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: ./gradlew :app:desktop:packageDeb :app:desktop:packageRpm --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            app/desktop/build/compose/binaries/main/deb/*.deb
            app/desktop/build/compose/binaries/main/rpm/*.rpm

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Release signing key (from repository secrets, when set)
        env:
          KEYSTORE_BASE64: ${{ secrets.RURU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RURU_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=ruru\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - run: ./gradlew :app:android:assembleRelease --console=plain
      - run: |
          version=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          mkdir -p out
          cp app/android/build/outputs/apk/release/*.apk "out/ruru-$version.apk"
      - uses: actions/upload-artifact@v7
        with: { name: android, path: out/*.apk }

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Bluetooth helper (universal binary)
        run: |
          mkdir -p app/desktop/resources/macos
          swiftc -O -target arm64-apple-macos12 platform/macos/helper/main.swift -o /tmp/ruru-bt-arm64
          swiftc -O -target x86_64-apple-macos12 platform/macos/helper/main.swift -o /tmp/ruru-bt-x64
          lipo -create /tmp/ruru-bt-arm64 /tmp/ruru-bt-x64 -output app/desktop/resources/macos/ruru-bt-mac
          chmod +x app/desktop/resources/macos/ruru-bt-mac
      - run: ./gradlew :app:desktop:packageDmg --console=plain
      - name: Packaging log
        if: failure()
        run: cat app/desktop/build/compose/logs/*/*.txt || true
      - name: Name the file after the real version
        run: |
          v=$(grep '^ruru.version=' gradle.properties | cut -d= -f2)
          mkdir -p out && mv app/desktop/build/compose/binaries/main/dmg/*.dmg "out/Ruru-$v-macos.dmg"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: out/*.dmg }

  ios:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:shared:linkReleaseFrameworkIosArm64 --console=plain
      - run: brew install xcodegen
      - name: Unsigned IPA (sign it with your own sideloading tool)
        run: |
          cd iosApp
          xcodegen generate
          xcodebuild -project Ruru.xcodeproj -scheme Ruru -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          version=$(grep '^ruru.version=' ../gradle.properties | cut -d= -f2)
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/Ruru.app Payload/
          zip -qr "out/Ruru-$version.ipa" Payload
      - uses: actions/upload-artifact@v7
        with: { name: ios, path: iosApp/out/*.ipa }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, android, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
