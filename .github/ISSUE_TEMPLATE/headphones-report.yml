name: Headphones report
description: Tell us how Ruru works with your Bose headphones
labels: ["headphones report"]
body:
  - type: markdown
    attributes:
      value: |
        A report from real headphones is how a model moves up the README's list. It takes a few minutes.
  - type: dropdown
    id: model
    attributes:
      label: Headphones
      options:
        - QC Ultra Headphones (1st Gen)
        - QC Ultra Headphones (2nd Gen)
        - QC Ultra Earbuds (1st Gen)
        - QC Ultra Earbuds (2nd Gen)
        - QC Headphones (1st Gen)
        - QC Headphones (2nd Gen)
        - QC SC
        - QC45
        - QC SE
        - QC Earbuds II
        - QC Earbuds (2020)
        - Ultra Open Earbuds
        - Noise Cancelling Headphones 700
        - Other (say which under What works)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device and system
      placeholder: Windows 11, MacBook Air on macOS 15, Pixel 8 on Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ruru version
      description: It's at the bottom of Ruru's window, for example 0.1.0.
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: What works
  - type: textarea
    id: broken
    attributes:
      label: What doesn't
  - type: textarea
    id: report
    attributes:
      label: Connection report
      description: In Ruru, scroll to the bottom, press Copy connection report and paste it here. Bluetooth addresses are masked and the names of your other devices are left out.
      render: text
