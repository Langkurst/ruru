org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# iPhone code is compiled and linked on a Mac (GitHub's Mac build machines). On Windows and Linux
# the iPhone targets are skipped quietly instead of failing the build.
kotlin.native.ignoreDisabledTargets=true

# The app version, used by every app module and the installers.
ruru.version=0.1.0
android.useAndroidX=true
android.nonTransitiveRClass=true
